name: Inventra CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ==========================================
  # Job 1: Backend CI (Build, Test, Security)
  # ==========================================
  backend-ci:
    name: Backend CI (Spring Boot & Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/InventoryMgtSys

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Backend with Maven
        run: mvn clean test -B

      - name: DevSecOps - Trivy Vulnerability Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend/InventoryMgtSys'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # Job 2: Frontend CI (Lint & Build React)
  # ==========================================
  frontend-ci:
    name: Frontend CI (React & Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

      - name: DevSecOps - Trivy Vulnerability Scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'frontend'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # Job 3: Kubernetes & Helm Validation
  # ==========================================
  k8s-validate:
    name: Validate Kubernetes & Helm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate K8s Manifests (Dry Run)
        run: |
          kubectl apply --dry-run=client -k k8s/

      - name: Lint Helm Chart
        run: |
          helm lint helm/inventra

  # ==========================================
  # Job 4: Docker Build & Push (CD)
  # ==========================================
  docker-build-push:
    name: Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, k8s-validate]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push Backend Container Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/inventra-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/inventra-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Frontend Container Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=/api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/inventra-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/inventra-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
