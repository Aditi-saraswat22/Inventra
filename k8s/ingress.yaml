apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventra-ingress
  namespace: inventra
  labels:
    app.kubernetes.io/name: ingress
    app.kubernetes.io/part-of: inventra
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: inventra.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5050
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
