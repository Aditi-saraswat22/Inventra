apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: inventra
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: inventra
data:
  SERVER_PORT: "5050"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql.inventra.svc.cluster.local:3306/ims_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
  SPRING_DATASOURCE_USERNAME: "root"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
